services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: relay-falkordb-demo
    ports:
      - "6379:6379"
      - "3010:3000"
    environment:
      REDIS_ARGS: "--save 30 1 --save 300 10 --appendonly no"
    volumes:
      - falkordb_demo_data:/var/lib/falkordb/data
    restart: unless-stopped

  relay:
    build: .
    container_name: relay-demo
    depends_on:
      - falkordb
    ports:
      - "3001:3001"
    environment:
      RELAY_PORT: "3001"
      RELAY_BIND_HOST: "0.0.0.0"
      RELAY_FALKOR_URL: "falkor://falkordb:6379"
      RELAY_FALKOR_GRAPH_PREFIX: "demo_"
      RELAY_PUBLIC_READONLY: "1"
      RELAY_SKIP_GLOBAL_HOOKS: "1"
    restart: unless-stopped

volumes:
  falkordb_demo_data: {}
